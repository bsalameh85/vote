<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسة آل البيت - لوحة التحكم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary-color: #1e3c72; --accent-color: #3498db; --success-color: #2ecc71; --light-bg: #f8f9fa; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--light-bg); color: #333; padding-bottom: 60px; }
        
        /* ترويسة الصفحة مع الشعار والعنوان */
        header { 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: white; 
            text-align: center; 
            padding: 1.5rem 1rem; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            background: white;
            padding: 5px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        header h1 {
            font-size: 2rem;
            margin-top: 5px;
        }
        
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; }
        .card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 10px 20px rgba(0,0,0,0.08); border-top: 5px solid var(--accent-color); margin-bottom: 2rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px; }
        .btn { display: inline-block; width: 100%; padding: 0.8rem; border: none; border-radius: 8px; background-color: var(--accent-color); color: white; font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-success { background-color: var(--success-color); }
        .btn-danger { background-color: #e74c3c; }
        .candidates-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.2rem; margin-top: 1rem; }
        .candidate-card { background: white; border-radius: 12px; padding: 1rem; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .candidate-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin: 0 auto 0.8rem; border: 3px solid var(--accent-color); }
        .candidate-name { font-weight: bold; font-size: 1.1rem; color: var(--primary-color); }
        .candidate-class { font-size: 0.85rem; color: #666; background: #eef2f5; display: inline-block; padding: 2px 10px; border-radius: 12px; margin: 0.4rem 0; }
        .candidate-votes { font-size: 1.2rem; color: var(--accent-color); font-weight: bold; background: #eef7fc; padding: 0.4rem; border-radius: 20px; }
        .finish-section { text-align: center; margin: 2rem 0; display: flex; gap: 15px; justify-content: center; }
        .finish-section .btn { width: auto; padding: 1rem 2rem; border-radius: 30px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 2.5rem; border-radius: 20px; text-align: center; max-width: 500px; width: 90%; }
        .loading { text-align: center; font-size: 1.2rem; color: #666; margin: 2rem 0; }
        
        .image-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; display: none; margin: 10px auto; border: 2px solid var(--accent-color); }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="شعار مدرسة آل البيت" class="header-logo" onerror="this.style.display='none'">
        <h1>مدرسة آل البيت</h1>
        <p>لوحة التحكم والنتائج المباشرة للانتخابات الطلابية</p>
    </header>

    <div class="container">
        <div class="card">
            <h2><i class="fas fa-user-plus"></i> إضافة مرشح جديد</h2>
            <form id="addCandidateForm">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label>اسم المرشح:</label>
                        <input type="text" id="candidateName" required placeholder="اسم الطالب">
                    </div>
                    <div class="form-group">
                        <label>الصف / الشعبة:</label>
                        <input type="text" id="candidateClass" required placeholder="مثال: العاشر (أ)">
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-image"></i> إرفاق صورة المرشح من الجهاز:</label>
                    <input type="file" id="candidateImageFile" accept="image/*" onchange="previewSelectedImage(event)">
                    <img id="imgPreview" class="image-preview" alt="معاينة الصورة">
                </div>

                <button type="submit" class="btn" id="submitBtn"><i class="fas fa-plus-circle"></i> إضافة إلى Google Sheets</button>
            </form>
        </div>

        <h2><i class="fas fa-chart-bar"></i> النتائج المباشرة من Google Sheets</h2>
        <div id="loadingText" class="loading"><i class="fas fa-spinner fa-spin"></i> جاري تحميل البيانات...</div>
        <div class="candidates-list" id="candidatesList"></div>

        <div class="finish-section">
            <button class="btn btn-success" onclick="announceWinner()"><i class="fas fa-trophy"></i> إعلان الفائز</button>
            <button class="btn btn-danger" onclick="resetVotes()"><i class="fas fa-redo"></i> تصفير الأصوات</button>
        </div>
    </div>

    <div class="modal" id="winnerModal">
        <div class="modal-content">
            <div style="font-size: 4rem; color: #f1c40f;"><i class="fas fa-crown"></i></div>
            <img src="" id="winnerModalImg" style="width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 5px solid #f1c40f; margin: 1rem 0;">
            <div id="winnerModalName" style="font-size: 2rem; color: #1e3c72; font-weight: bold;"></div>
            <div id="winnerModalClass" style="color: #555; margin-bottom: 0.8rem;"></div>
            <div id="winnerModalVotes" style="font-size: 1.2rem; color: #3498db; font-weight: bold; margin-bottom: 1.5rem;"></div>
            <button class="btn" onclick="document.getElementById('winnerModal').style.display='none'">إغلاق</button>
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxTYtQqY97iizNUvKjYqwLzgokZMnprO9Q_w8RYYPZFecQCFkDkq769A1XqmSUWfdPC/exec";
        const defaultAvatar = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
        let candidates = [];
        let uploadedBase64Image = "";

        function previewSelectedImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedBase64Image = e.target.result;
                    const preview = document.getElementById('imgPreview');
                    preview.src = uploadedBase64Image;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        async function fetchCandidates() {
            try {
                const res = await fetch(GOOGLE_SHEET_API_URL);
                candidates = await res.json();
                document.getElementById('loadingText').style.display = 'none';
                renderCandidates();
            } catch (err) {
                console.error("خطأ في جلب البيانات:", err);
            }
        }

        function renderCandidates() {
            const candidatesList = document.getElementById('candidatesList');
            candidatesList.innerHTML = '';
            if (candidates.length === 0) {
                candidatesList.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777;">لا يوجد مرشحين حتى الآن.</p>';
                return;
            }
            [...candidates].sort((a, b) => b.votes - a.votes).forEach(c => {
                const card = document.createElement('div');
                card.className = 'candidate-card';
                card.innerHTML = `
                    <img src="${c.image || defaultAvatar}" class="candidate-img" alt="${c.name}">
                    <div class="candidate-name">${c.name}</div>
                    <div class="candidate-class">${c.candidateClass}</div>
                    <div class="candidate-votes"><i class="fas fa-vote-yea"></i> ${c.votes} صوت</div>
                `;
                candidatesList.appendChild(card);
            });
        }

        document.getElementById('addCandidateForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "جاري رفع الصورة والإضافة...";

            const name = document.getElementById('candidateName').value.trim();
            const candidateClass = document.getElementById('candidateClass').value.trim();
            const finalImage = uploadedBase64Image || defaultAvatar;

            const newCandidate = {
                action: "add",
                id: Date.now(),
                name: name,
                candidateClass: candidateClass,
                image: finalImage
            };

            await fetch(GOOGLE_SHEET_API_URL, {
                method: "POST",
                body: JSON.stringify(newCandidate)
            });

            this.reset();
            uploadedBase64Image = "";
            document.getElementById('imgPreview').style.display = 'none';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-plus-circle"></i> إضافة إلى Google Sheets';
            fetchCandidates();
        });

        async function resetVotes() {
            if (confirm("هل أنت تأكد من تصفير جميع الأصوات في Google Sheets؟")) {
                document.getElementById('loadingText').style.display = 'block';
                await fetch(GOOGLE_SHEET_API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "reset" })
                });
                fetchCandidates();
            }
        }

        function announceWinner() {
            if (candidates.length === 0) return alert('لا يوجد مرشحون!');
            let winner = candidates.reduce((max, c) => c.votes > max.votes ? c : max, candidates[0]);
            if (winner.votes === 0) return alert('لم يتم التصويت لأي مرشح بعد!');

            document.getElementById('winnerModalImg').src = winner.image || defaultAvatar;
            document.getElementById('winnerModalName').innerText = winner.name;
            document.getElementById('winnerModalClass').innerText = `الصف: ${winner.candidateClass}`;
            document.getElementById('winnerModalVotes').innerText = `إجمالي الأصوات: ${winner.votes} صوت`;
            document.getElementById('winnerModal').style.display = 'flex';
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
        }

        fetchCandidates();
        setInterval(fetchCandidates, 3000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسة آل البيت - لوحة التحكم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary-color: #1e3c72; --accent-color: #3498db; --success-color: #2ecc71; --light-bg: #f8f9fa; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--light-bg); color: #333; padding-bottom: 60px; }
        
        header { 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: white; 
            text-align: center; 
            padding: 1.5rem 1rem; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            background: white;
            padding: 5px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        header h1 { font-size: 2rem; margin-top: 5px; }
        
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; }
        .card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 10px 20px rgba(0,0,0,0.08); border-top: 5px solid var(--accent-color); margin-bottom: 2rem; }
        .form-group { margin-bottom: 1rem; text-align: right; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px; }
        
        .btn { display: inline-block; width: 100%; padding: 0.8rem; border: none; border-radius: 8px; background-color: var(--accent-color); color: white; font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-success { background-color: var(--success-color); }
        .btn-danger { background-color: #e74c3c; }
        .btn-warning { background-color: #f39c12; color: white; }

        .candidates-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.2rem; margin-top: 1rem; }
        .candidate-card { background: white; border-radius: 12px; padding: 1rem; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.08); position: relative; }
        .candidate-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin: 0 auto 0.8rem; border: 3px solid var(--accent-color); }
        .candidate-name { font-weight: bold; font-size: 1.1rem; color: var(--primary-color); }
        .candidate-class { font-size: 0.85rem; color: #666; background: #eef2f5; display: inline-block; padding: 2px 10px; border-radius: 12px; margin: 0.4rem 0; }
        .candidate-votes { font-size: 1.2rem; color: var(--accent-color); font-weight: bold; background: #eef7fc; padding: 0.4rem; border-radius: 20px; margin-bottom: 0.8rem; transition: all 0.3s ease; }
        
        /* أزرار التحكم في الكرت */
        .card-actions { display: flex; gap: 8px; justify-content: center; margin-top: 0.5rem; }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 6px; width: auto; flex: 1; border: none; cursor: pointer; font-weight: bold; }
        .btn-edit { background-color: #f39c12; color: white; }
        .btn-delete { background-color: #e74c3c; color: white; }

        .finish-section { text-align: center; margin: 2rem 0; display: flex; gap: 15px; justify-content: center; }
        .finish-section .btn { width: auto; padding: 1rem 2rem; border-radius: 30px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; overflow-y: auto; padding: 20px; }
        .modal-content { background: white; padding: 2rem; border-radius: 20px; text-align: center; max-width: 650px; width: 95%; max-height: 90vh; overflow-y: auto; }
        .loading { text-align: center; font-size: 1.2rem; color: #666; margin: 2rem 0; }
        
        .image-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; display: none; margin: 10px auto; border: 2px solid var(--accent-color); }

        /* تنسيقات كروت الفائزين حسب الصف */
        .winners-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1.5rem; text-align: center; }
        .winner-card { background: #fffdf0; border: 2px solid #f1c40f; border-radius: 15px; padding: 1rem; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .winner-badge { position: absolute; top: -12px; right: 50%; transform: translateX(50%); background: #f1c40f; color: #fff; padding: 2px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
        .winner-class-title { font-weight: bold; color: var(--primary-color); font-size: 1.1rem; margin-top: 0.5rem; margin-bottom: 0.5rem; border-bottom: 1px dashed #ddd; padding-bottom: 0.3rem; }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="شعار مدرسة آل البيت" class="header-logo" onerror="this.style.display='none'">
        <h1>مدرسة آل البيت</h1>
        <p>لوحة التحكم والنتائج المباشرة للانتخابات الطلابية</p>
    </header>

    <div class="container">
        <div class="card">
            <h2><i class="fas fa-user-plus"></i> إضافة مرشح جديد</h2>
            <form id="addCandidateForm">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label>اسم المرشح:</label>
                        <input type="text" id="candidateName" required placeholder="اسم الطالب">
                    </div>
                    <div class="form-group">
                        <label>الصف / الشعبة:</label>
                        <input type="text" id="candidateClass" required placeholder="مثال: العاشر (أ)">
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-image"></i> إرفاق صورة المرشح من الجهاز:</label>
                    <input type="file" id="candidateImageFile" accept="image/*" onchange="previewSelectedImage(event, 'imgPreview', 'add')">
                    <img id="imgPreview" class="image-preview" alt="معاينة الصورة">
                </div>

                <button type="submit" class="btn" id="submitBtn"><i class="fas fa-plus-circle"></i> إضافة إلى Google Sheets</button>
            </form>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2><i class="fas fa-chart-bar"></i> النتائج المباشرة من Google Sheets</h2>
            <small style="color: #666;"><i class="fas fa-sync-alt fa-spin"></i> تحديث تلقائي حيي (كل 3 ثوانٍ)</small>
        </div>

        <div id="loadingText" class="loading"><i class="fas fa-spinner fa-spin"></i> جاري تحميل البيانات...</div>
        <div class="candidates-list" id="candidatesList"></div>

        <div class="finish-section">
            <button class="btn btn-success" onclick="announceWinnerByClass()"><i class="fas fa-trophy"></i> إعلان الفائزين حسب الصفوف</button>
            <button class="btn btn-danger" onclick="resetVotes()"><i class="fas fa-redo"></i> تصفير الأصوات</button>
        </div>
    </div>

    <!-- نافذة تعديل بيانات المرشح -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2 style="color: var(--primary-color); margin-bottom: 1rem;"><i class="fas fa-edit"></i> تعديل بيانات المرشح</h2>
            <form id="editCandidateForm">
                <input type="hidden" id="editCandidateId">
                <div class="form-group">
                    <label>الاسم الكامل:</label>
                    <input type="text" id="editCandidateName" required>
                </div>
                <div class="form-group">
                    <label>الصف / الشعبة:</label>
                    <input type="text" id="editCandidateClass" required>
                </div>
                <div class="form-group">
                    <label>تغيير الصورة (اختياري):</label>
                    <input type="file" id="editCandidateImageFile" accept="image/*" onchange="previewSelectedImage(event, 'editImgPreview', 'edit')">
                    <img id="editImgPreview" class="image-preview" style="display:block;" alt="المعاينة الحالية">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-warning" id="saveEditBtn">حفظ التغييرات</button>
                    <button type="button" class="btn btn-danger" onclick="closeEditModal()">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة إعلان الفائزين حسب الصف -->
    <div class="modal" id="winnerModal">
        <div class="modal-content">
            <div style="font-size: 3.5rem; color: #f1c40f;"><i class="fas fa-crown"></i></div>
            <h2 style="color: var(--primary-color); margin-bottom: 0.5rem;">قائمة الفائزين بالانتخابات الطلابية</h2>
            <p style="color: #666; font-size: 0.95rem;">الفائز بالأعلى تصويتاً عن كل صف وشعبة</p>

            <div class="winners-grid" id="winnersContainer">
                <!-- يتم تعبئته ديناميكياً -->
            </div>

            <button class="btn" style="margin-top: 2rem;" onclick="document.getElementById('winnerModal').style.display='none'">إغلاق</button>
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxTYtQqY97iizNUvKjYqwLzgokZMnprO9Q_w8RYYPZFecQCFkDkq769A1XqmSUWfdPC/exec";
        const defaultAvatar = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
        let candidates = [];
        let isEditing = false;
        let uploadedAddBase64Image = "";
        let uploadedEditBase64Image = "";

        function previewSelectedImage(event, previewId, mode) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (mode === 'add') uploadedAddBase64Image = e.target.result;
                    if (mode === 'edit') uploadedEditBase64Image = e.target.result;
                    
                    const preview = document.getElementById(previewId);
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        // جلب البيانات بدون إعادة رسم الصفحة كاملة في حال عدم التغير
        async function fetchCandidatesSilently() {
            if (isEditing) return; // عدم التحديث أثناء التعديل لتجنب خربطة الإدخال

            try {
                const res = await fetch(GOOGLE_SHEET_API_URL);
                const newData = await res.json();
                
                document.getElementById('loadingText').style.display = 'none';

                // التأكد مما إذا كانت هناك تغييرات
                if (JSON.stringify(newData) !== JSON.stringify(candidates)) {
                    candidates = newData;
                    renderCandidates();
                }
            } catch (err) {
                console.error("خطأ في جلب البيانات تلقائياً:", err);
            }
        }

        function renderCandidates() {
            const candidatesList = document.getElementById('candidatesList');
            candidatesList.innerHTML = '';

            if (candidates.length === 0) {
                candidatesList.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777;">لا يوجد مرشحين حتى الآن.</p>';
                return;
            }

            [...candidates].sort((a, b) => b.votes - a.votes).forEach(c => {
                const card = document.createElement('div');
                card.className = 'candidate-card';
                card.innerHTML = `
                    <img src="${c.image || defaultAvatar}" class="candidate-img" alt="${c.name}">
                    <div class="candidate-name">${c.name}</div>
                    <div class="candidate-class">${c.candidateClass}</div>
                    <div class="candidate-votes"><i class="fas fa-vote-yea"></i> ${c.votes} صوت</div>
                    <div class="card-actions">
                        <button class="btn-sm btn-edit" onclick="openEditModal('${c.id}')"><i class="fas fa-edit"></i> تعديل</button>
                        <button class="btn-sm btn-delete" onclick="deleteCandidate('${c.id}')"><i class="fas fa-trash"></i> حذف</button>
                    </div>
                `;
                candidatesList.appendChild(card);
            });
        }

        // إضافة مرشح
        document.getElementById('addCandidateForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "جاري الحفظ...";

            const name = document.getElementById('candidateName').value.trim();
            const candidateClass = document.getElementById('candidateClass').value.trim();
            const finalImage = uploadedAddBase64Image || defaultAvatar;

            const newCandidate = {
                action: "add",
                id: Date.now(),
                name: name,
                candidateClass: candidateClass,
                image: finalImage
            };

            await fetch(GOOGLE_SHEET_API_URL, {
                method: "POST",
                body: JSON.stringify(newCandidate)
            });

            this.reset();
            uploadedAddBase64Image = "";
            document.getElementById('imgPreview').style.display = 'none';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-plus-circle"></i> إضافة إلى Google Sheets';
            fetchCandidatesSilently();
        });

        // فتح نافذة التعديل
        function openEditModal(candidateId) {
            isEditing = true;
            const candidate = candidates.find(c => c.id == candidateId);
            if (!candidate) return;

            document.getElementById('editCandidateId').value = candidate.id;
            document.getElementById('editCandidateName').value = candidate.name;
            document.getElementById('editCandidateClass').value = candidate.candidateClass;
            
            const preview = document.getElementById('editImgPreview');
            preview.src = candidate.image || defaultAvatar;
            preview.style.display = 'block';
            uploadedEditBase64Image = "";

            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            isEditing = false;
            document.getElementById('editModal').style.display = 'none';
        }

        // حفظ التعديل
        document.getElementById('editCandidateForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('saveEditBtn');
            saveBtn.disabled = true;
            saveBtn.innerText = "جاري التحديث...";

            const id = document.getElementById('editCandidateId').value;
            const name = document.getElementById('editCandidateName').value.trim();
            const candidateClass = document.getElementById('editCandidateClass').value.trim();

            const editPayload = {
                action: "edit",
                id: id,
                name: name,
                candidateClass: candidateClass,
                image: uploadedEditBase64Image
            };

            await fetch(GOOGLE_SHEET_API_URL, {
                method: "POST",
                body: JSON.stringify(editPayload)
            });

            saveBtn.disabled = false;
            saveBtn.innerText = "حفظ التغييرات";
            closeEditModal();
            fetchCandidatesSilently();
        });

        // حذف مرشح
        async function deleteCandidate(candidateId) {
            if (confirm("هل أنت تأكد من حذف هذا المرشح نهائياً من Google Sheets؟")) {
                document.getElementById('loadingText').style.display = 'block';
                await fetch(GOOGLE_SHEET_API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "delete", id: candidateId })
                });
                fetchCandidatesSilently();
            }
        }

        // تصفير الأصوات
        async function resetVotes() {
            if (confirm("هل أنت تأكد من تصفير جميع الأصوات في Google Sheets؟")) {
                document.getElementById('loadingText').style.display = 'block';
                await fetch(GOOGLE_SHEET_API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "reset" })
                });
                fetchCandidatesSilently();
            }
        }

        // إعلان الفائزين مقسمين حسب كل صف وشعبة
        function announceWinnerByClass() {
            if (candidates.length === 0) return alert('لا يوجد مرشحون!');

            // تجميع المرشحين حسب الصف
            const groupedByClass = {};
            candidates.forEach(c => {
                const className = c.candidateClass.trim();
                if (!groupedByClass[className]) {
                    groupedByClass[className] = [];
                }
                groupedByClass[className].push(c);
            });

            const winnersContainer = document.getElementById('winnersContainer');
            winnersContainer.innerHTML = '';
            let hasVotes = false;

            // اختيار الأعلى تصويتاً من كل صف
            Object.keys(groupedByClass).forEach(className => {
                const classCandidates = groupedByClass[className];
                // ترتيب مرشحي الصف حسب الأصوات
                classCandidates.sort((a, b) => b.votes - a.votes);
                
                const winner = classCandidates[0]; // الفائز بالمرتبة الأولى للصف
                
                if (winner && winner.votes > 0) {
                    hasVotes = true;
                    const winnerCard = document.createElement('div');
                    winnerCard.className = 'winner-card';
                    winnerCard.innerHTML = `
                        <div class="winner-badge"><i class="fas fa-medal"></i> الأول</div>
                        <div class="winner-class-title">${className}</div>
                        <img src="${winner.image || defaultAvatar}" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #f1c40f; margin: 0.5rem 0;">
                        <div style="font-weight: bold; font-size: 1.1rem; color: #1e3c72;">${winner.name}</div>
                        <div style="color: #3498db; font-weight: bold; font-size: 0.95rem; margin-top: 5px;"><i class="fas fa-vote-yea"></i> ${winner.votes} صوت</div>
                    `;
                    winnersContainer.appendChild(winnerCard);
                }
            });

            if (!hasVotes) {
                return alert('لم يتم التصويت لأي مرشح بعد!');
            }

            document.getElementById('winnerModal').style.display = 'flex';
            confetti({ particleCount: 180, spread: 90, origin: { y: 0.6 } });
        }

        // التشغيل المباشر والتحديث التلقائي المباشر كل 3 ثوانٍ
        fetchCandidatesSilently();
        setInterval(fetchCandidatesSilently, 3000);
    </script>
</body>
</html>
